<div class="container ms-4 mt-5 d-flex flex-column">
    <h1 class="text-dark-blue-medium mb-5">Редактирование дохода/расхода</h1>
    <div class="row">
        <div class="col-12 col-md-4">
            <div class="input-group mb-3">
                <select id="select-categories" class="form-select ">
                    <option value="income">Доход</option>
                    <option value="expense">Расход</option>
                </select>
            </div>
            <div class="input-group mb-3">
                <select  id="select-category" class="form-select">

                </select>
            </div>
            <div class="input-group mb-3">
                <input id="amount-input" type="number" class="form-control" placeholder="Сумма в $...">
                <span id="amount-error" class="error invalid-feedback">Введите сумму</span>
            </div>
            <div class="input-group mb-3">
                <input id="date-input" type="date" class="form-control " placeholder="Дата...">
                <span id="date-error" class="error invalid-feedback">Выберите дату</span>
            </div>
            <div class="input-group mb-3">
                <textarea id="comm-input" type="text" class="form-control " placeholder="Комментарий..."></textarea>
                <span id="comm-error" class="error invalid-feedback">Введите комментарий</span>

            </div>


            <div class="d-flex gap-2">
                <button id="process-btn" type="button" class="btn btn-success">Создать</button>
                <a href="/#/income-expense">
                    <button class="btn btn-danger">Отмена</button>
                </a>
            </div>
        </div>
    </div>


</div>
