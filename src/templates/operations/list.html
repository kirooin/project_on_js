<div class="container ms-4 mt-5 d-flex flex-column">
    <h1 class="text-dark-blue-medium mb-5">Доходы и расходы</h1>
    <div class="row mb-5">
        <div class="d-flex gap-2 mb-4 font-roboto-medium">
            <a href="/#/income-expense/create/income"><button class="btn btn-success">Создать доход</button></a>
            <a href="/#/income-expense/create/expense"><button class="btn btn-danger">Создать расход</button></a>
        </div>
        <div class="d-flex gap-3 align-items-center font-roboto-medium">
            <a href="/#/income-expense?period=today"><div class="btn btn-secondary py-1 px-3 width-100 period-btn" data-period="today">Сегодня</div></a>
            <a href="/#/income-expense?period=week"><div class="btn btn-outline-secondary py-1 px-3 width-100 period-btn" data-period="week">Неделя</div></a>
            <a href="/#/income-expense?period=month"><div class="btn btn-outline-secondary py-1 px-3 width-100 period-btn" data-period="month">Месяц</div></a>
            <a href="/#/income-expense?period=year"><div class="btn btn-outline-secondary py-1 px-3 width-100 period-btn" data-period="year">Год</div></a>
            <a href="/#/income-expense?period=all"><div class="btn btn-outline-secondary py-1 px-3 width-100 period-btn" data-period="all">Все</div></a>
            <a id="interval-btn" href="javascript:void(0)"><div class="btn btn-outline-secondary py-1 px-3 width-100 period-btn" data-period="interval">Интервал</div></a>
            с
            <span class="text-secondary outline-secondary date-text" id="startDateText">Дата</span>
            по
            <span class="text-secondary outline-secondary date-text" id="endDateText">Дата</span>
        </div>
    </div>

    <table class="table text-center">
        <thead>
        <tr class="border-top">
            <th scope="col" class="text-dark-blue-bold">№ операции</th>
            <th scope="col" class="text-dark-blue-bold">Тип</th>
            <th scope="col" class="text-dark-blue-bold">Категория</th>
            <th scope="col" class="text-dark-blue-bold">Сумма</th>
            <th scope="col" class="text-dark-blue-bold">Дата</th>
            <th scope="col" class="text-dark-blue-bold">Комментарий</th>
            <th scope="col" class="text-dark-blue-bold"></th>
        </tr>
        </thead>
        <tbody class="font-roboto" id="operations">

        </tbody>
    </table>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content py-3">
            <div class="modal-body text-center">
                <p class="custom-card-title-text fs-5 mb-3">Вы действительно хотите удалить операцию?</p>
                <a href="javascript:void(0)" id="accept-delete">
                    <button type="button" class="btn btn-success me-2" data-bs-dismiss="modal" >Да, удалить
                    </button>
                </a>

                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Не удалять</button>
            </div>
        </div>
    </div>
</div>
